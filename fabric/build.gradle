plugins {
    id 'multiloader-loader'
    id 'net.fabricmc.fabric-loom'
    id 'com.modrinth.minotaur'
    id 'net.darkhax.curseforgegradle'
}

repositories {
    maven { url "https://maven.terraformersmc.com/releases/" }
}


dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_version}"

    // ModMenu
    implementation("com.terraformersmc:modmenu:${project.modmenu_version}")
}

loom {
    def aw = project(':common').file("src/main/resources/${mod_id}.accesswidener")
    if (aw.exists()) {
        accessWidenerPath.set(aw)
    }
    runs {
        client {
            client()
            setConfigName('Fabric Client')
            ideConfigGenerated(true)
            runDir('runs/client')
        }
        server {
            server()
            setConfigName('Fabric Server')
            ideConfigGenerated(true)
            runDir('runs/server')
        }
    }
}

// Implement mcgradleconventions loader attribute
def loaderAttribute = Attribute.of('io.github.mcgradleconventions.loader', String)
['apiElements', 'runtimeElements', 'sourcesElements', 'javadocElements', 'modCompileClasspath'].each { variant ->
    configurations.named("$variant") {
        attributes {
            attribute(loaderAttribute, 'fabric')
        }
    }
}
sourceSets.configureEach {
    [it.compileClasspathConfigurationName, it.runtimeClasspathConfigurationName].each { variant->
        configurations.named("$variant") {
            attributes {
                attribute(loaderAttribute, 'fabric')
            }
        }
    }
}

// Publishing, run by the release workflow (.github/workflows/release.yml)
// The full changelog lives on the Fabric upload; NeoForge only points here.
def releaseNotes = rootProject.file('release-notes.md')

modrinth {
    token = System.getenv('MODRINTH_TOKEN')
    projectId = modrinth_project_id
    versionNumber = version.toString()
    versionName = "${mod_name} ${version}"
    versionType = 'release'
    uploadFile = jar
    gameVersions = mcVersions
    loaders = ['fabric']
    changelog = releaseNotes.exists() ? releaseNotes.text : ''
    dependencies {
        required.project 'fabric-api'
        optional.project 'modmenu'
    }
}

tasks.register('curseforge', net.darkhax.curseforgegradle.TaskPublishCurseForge) {
    apiToken = System.getenv('CURSEFORGE_TOKEN')
    def mainFile = upload(curseforge_project_id, jar)
    mainFile.displayName = "${mod_name} ${version}"
    mainFile.releaseType = 'release'
    mainFile.changelog = releaseNotes.exists() ? releaseNotes.text : ''
    mainFile.changelogType = 'markdown'
    mainFile.addModLoader('Fabric')
    mcVersions.each { mainFile.addGameVersion(it) }
    mainFile.addJavaVersion("Java ${java_version}")
    mainFile.addRequirement('fabric-api')
    mainFile.addOptional('modmenu')
}
