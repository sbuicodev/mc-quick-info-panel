# Important Notes:
# Every field you add must be added to buildSrc/src/main/groovy/multiloader-common.gradle expandProps map.

# Project
# Mod version only; each jar gets `+<loader>-<minecraft versions>` appended (e.g. 1.3.0+fabric-26.3)
version=1.3.0
group=net.hawkelele.quickinfopanel
java_version=25

# Publishing (used by the Modrinth/CurseForge tasks only, not expanded into resources)
modrinth_project_id=tB3khS0m
curseforge_project_id=CURSEFORGE_PROJECT_ID

# Common
## Version the mod is compiled against
minecraft_version=26.3
## Comma-separated Minecraft versions the jars support, in ascending order (e.g. 26.3,26.3.1).
## Drives the fabric.mod.json / neoforge.mods.toml ranges and the Modrinth/CurseForge game versions.
minecraft_versions=26.3
mod_name=Quick Info Panel
mod_author=Hawkelele
mod_id=quickinfopanel
license=MIT
credits=
description=A simple info panel that display coordinates and stuff.
## This is the version of minecraft that the 'common' project uses, you can find a list of all versions here
## https://projects.neoforged.net/neoforged/neoform
neo_form_version=26.3-1

# Fabric, see https://fabricmc.net/develop/ for new versions
fabric_version=0.163.0+26.3
fabric_loader_version=0.19.5
fabric_loom_version=1.17-SNAPSHOT
# Fabric UI
modmenu_version=21.0.0

# NeoForge, see https://projects.neoforged.net/neoforged/neoforge for new versions
neoforge_version=26.3.0.86
neoforge_loader_version_range=[4,)
neoforge_moddev_version=2.0.148

# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=false
