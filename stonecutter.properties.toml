# Shared by every node, see https://stonecutter.kikugie.dev/wiki/v2/reference/gradle-api/structured-properties
# Sections below override values per Minecraft version (["1.21"]) and per loader ([fabric."1.21"]).

mod.id = "quickinfopanel"
mod.name = "Quick Info Panel"
mod.group = "net.hawkelele.quickinfopanel"
# Mod version only; each jar gets `+<loader>-<minecraft versions>` appended (e.g. 1.3.1+fabric-26.3)
mod.version = "1.3.1"
mod.author = "Hawkelele"
mod.license = "MIT"
mod.credits = ""
mod.description = "A simple info panel that display coordinates and stuff."

# Publishing (used by the Modrinth/CurseForge tasks only)
publish.modrinth = "tB3khS0m"
publish.curseforge = "1752669"

deps.fabric_loader = "0.19.5"
loomx.loom_version = "1.17-SNAPSHOT"
deps.neoforge_loader_range = "[4,)"

# mod.mc_releases: every Minecraft version the jar supports, in ascending order. The first one is
# the node's own version; it drives the metadata ranges, jar name and Modrinth/CurseForge versions.

["26.3"]
mod.mc_releases = ["26.3"]
[fabric."26.3"]
deps.fabric_api = "0.163.0+26.3"
deps.modmenu = "21.0.0"
[neoforge."26.3"]
deps.neoforge = "26.3.0.86"

