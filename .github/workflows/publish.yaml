name: Publish

on:
  release:
    types: [published]

jobs:
  modrinth:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # Read the JSON file and save it to a variable
      - name: Load game versions
        id: load-versions
        uses: andstor/file-reader-action@v1
        with:
            path: "versions.json"

      - name: Find release asset
        id: asset
        uses: actions/github-script@v7
        with:
          script: |
            const release = await github.rest.repos.getReleaseByTag({
              owner: context.repo.owner,
              repo: context.repo.repo,
              tag: context.payload.release.tag_name,
            });

            const asset = release.data.assets.find((item) => item.name.endsWith('.jar'));

            if (!asset) {
              throw new Error(`No jar asset found for release ${context.payload.release.tag_name}`);
            }

            core.setOutput('name', asset.name);
            core.setOutput('url', asset.url);

      - name: Download release asset
        run: |
          curl -L \
            -H "Authorization: Bearer ${{ github.token }}" \
            -H "Accept: application/octet-stream" \
            "${{ steps.asset.outputs.url }}" \
            -o "${{ steps.asset.outputs.name }}"

      - uses: cloudnode-pro/modrinth-publish@v2
        with:
          token: ${{ secrets.MODRINTH_TOKEN }}
          project: ${{ vars.MODRINTH_ID }}
          name: ${{ github.event.release.name }}
          version: ${{ github.event.release.tag_name }}
          changelog: ${{ github.event.release.body }}
          loaders: fabric
          game-versions: ${{ steps.load-versions.outputs.contents }}
          files: ${{ steps.asset.outputs.name }}
