# Builds and publishes every supported Minecraft version when a version tag
# (e.g. v1.3.1) is pushed.
#
# The tag must match `mod.version` in stonecutter.properties.toml, and
# CHANGELOG.md must have a matching `## [1.3.1]` section, used as the release
# notes.
#
# Every Stonecutter node (Minecraft version × loader) is built from the tagged
# commit. All jars, named `<version>+<loader>-<minecraft versions>`, go on one
# GitHub release, and each is uploaded to Modrinth and CurseForge, tagged with
# its `mod.mc_releases`.

name: release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify tag matches version
        id: version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          MOD_VERSION="$(grep -E '^mod\.version *=' stonecutter.properties.toml | sed -E 's/.*"(.*)".*/\1/')"
          if [ "$TAG_VERSION" != "$MOD_VERSION" ]; then
            echo "::error::Tag '$GITHUB_REF_NAME' does not match mod.version '$MOD_VERSION' in stonecutter.properties.toml"
            exit 1
          fi
          echo "version=$MOD_VERSION" >> "$GITHUB_OUTPUT"

      - name: Extract changelog
        run: |
          awk -v v="${{ steps.version.outputs.version }}" '
            /^## \[/ { p = index($0, "## [" v "]") == 1; next }
            p
          ' CHANGELOG.md > release-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            echo "::error::No '## [${{ steps.version.outputs.version }}]' section in CHANGELOG.md"
            exit 1
          fi

      # Gradle runs on 25; the Java 21 nodes get their JDK through toolchains
      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: gradle

      - name: Build
        run: |
          chmod +x ./gradlew
          ./gradlew build buildAndCollect

      - name: GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: build/release/*.jar
          fail_on_unmatched_files: true
          body_path: release-notes.md

      # Stonecutter runs these one node at a time, oldest version first, so the
      # newest uploads end up on top of the Modrinth and CurseForge file lists.
      - name: Publish
        run: ./gradlew modrinth curseforge
        env:
          MODRINTH_TOKEN: ${{ secrets.MODRINTH_TOKEN }}
          CURSEFORGE_TOKEN: ${{ secrets.CURSEFORGE_TOKEN }}
